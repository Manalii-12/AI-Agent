# Render Blueprint Specification for Aura Skincare Voice Agent
# Automatically provisions free PostgreSQL database and Node.js backend service

databases:
  - name: aura-postgres-db
    databaseName: auradb
    user: aura_user
    plan: free
    region: oregon

services:
  - type: web
    name: aura-skincare-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aura-postgres-db
          property: connectionString
