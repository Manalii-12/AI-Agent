# Render Blueprint Specification for Aura Skincare Voice Agent
# Automatically provisions free PostgreSQL database and Node.js backend service

databases:
  - name: aura-postgres-db
    databaseName: auradb
    user: aura_user
    plan: free
    region: oregon

services:
  - type: web
    name: aura-skincare-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: aura-postgres-db
          property: connectionString
